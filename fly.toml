# fly.toml app configuration file generated for drink-water on 2026-11-05T13:12:58Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'drink-water'
primary_region = 'sin'

[build]
[env]
  DATA_DIR = '/data'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
